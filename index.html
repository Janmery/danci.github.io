<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1c1f26; --sub:#6b7280; --line:#e8eaef;
  --pri:#4f46e5; --pri-l:#eef0ff; --ok:#16a34a; --ok-l:#e9f7ef;
  --bad:#e11d48; --bad-l:#fdeef1; --warn:#d97706; --warn-l:#fef4e6;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
body{max-width:520px;margin:0 auto;padding-bottom:calc(70px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:14px 16px 8px}
.tabs{display:flex;gap:8px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-size:15px;font-weight:600;color:var(--sub);background:#fff;border:1px solid var(--line)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border-radius:16px;padding:16px;margin:10px 12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 16px rgba(16,24,40,.04)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--sub);font-size:13px}
.small{font-size:12px}
.hr{height:1px;background:var(--line);margin:12px 0}
.btn{padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;background:var(--pri);color:#fff;width:100%}
.btn:active{opacity:.85}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.gray{background:#eef0f4;color:#4b5563}
.btn.sm{padding:7px 12px;font-size:13px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45}
.chip{padding:6px 12px;border-radius:999px;font-size:13px;background:#eef0f4;color:#4b5563;font-weight:600}
.chip.on{background:var(--pri);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
input[type=search],input[type=text]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);font-size:15px;background:#fff;font-family:inherit;outline:none}
input:focus{border-color:var(--pri)}
/* 答题 */
.qword{font-size:34px;font-weight:800;letter-spacing:.5px;line-height:1.15}
.qph{color:var(--sub);font-size:15px;margin-top:4px;font-family:"Times New Roman",serif}
.opt{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;margin-top:10px;background:#fff;transition:.12s}
.opt .box{width:20px;height:20px;border-radius:6px;border:1.5px solid #c7cad3;flex:0 0 20px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700}
.opt.pick{border-color:var(--pri);background:var(--pri-l)}
.opt.pick .box{background:var(--pri);border-color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.right .box{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad)}
.opt.miss{border-color:var(--warn);background:var(--warn-l);border-style:dashed}
.opt .pos{font-weight:700;color:var(--pri);margin-right:6px;flex:0 0 auto}
.opt.right .pos,.opt.miss .pos{color:inherit}
.opt .txt{flex:1;font-size:15px;line-height:1.45}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:2px}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.bad{background:var(--bad-l);color:var(--bad)}
.tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.gray{background:#eef0f4;color:#6b7280}
.bar{height:6px;border-radius:999px;background:#eef0f4;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:999px;transition:.3s}
/* 列表 */
.item{padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.w{font-size:17px;font-weight:700}
.ph{font-size:13px;color:var(--sub);font-family:"Times New Roman",serif}
.mn{font-size:14px;line-height:1.5;margin-top:3px}
.mn b{color:var(--pri);font-weight:700;margin-right:4px}
.sw{width:46px;height:26px;border-radius:999px;background:#d7dae2;position:relative;flex:0 0 46px;transition:.18s}
.sw.on{background:var(--pri)}
.sw>i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}
.sw.on>i{left:23px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:40}
.nav button{flex:1;text-align:center;font-size:12px;color:var(--sub);padding:4px 0;font-weight:600}
.nav button.on{color:var(--pri)}
.nav .ico{font-size:19px;display:block;line-height:1.3}
.mask{position:fixed;inset:0;background:rgba(17,20,28,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60}
.modal{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:340px}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px}
.stat{display:flex;text-align:center}
.stat>div{flex:1}
.stat b{display:block;font-size:22px;font-weight:800}
</style>
</head>

    if(mode==='review'){const p=S.pool[i];if(p){p.streak=(p.streak||0)+1;
      if(p.streak>=needOf(i)){delPool(i);Q.mastered=1;Q.need=p.need||PASS_NEED}else save()}}
  }else{s.wrong++;s.last=Date.now();
    if(mode==='test')addPool(i,false);
    else{const p=S.pool[i];if(p){p.streak=0;save()}}}
  if(mode==='test'){S.batch.n++;if(Q.pass)S.batch.ok++}else{rstat.n++;if(Q.pass)rstat.ok++}
  save();render()
}
function afterNext(){
  if(mode==='test'){
    if(S.batch.n>0&&S.batch.n%BATCH===0){showBatch();return}
    adv(S.cur);const i=peek(S.cur);
    if(i<0){page='test';Q=null;render();alert2('本档已测完','可切换频档，或开启「重测全部」再练一轮。');return}
    Q=makeQ(i);render()
  }else{
    if(Q&&Q.mastered){const k=rq.indexOf(Q.i);if(k>=0)rq.splice(k,1)}else rqi++;
    if(rqi>=rq.length){showRsum();return}
    Q=makeQ(rq[rqi]);render()
  }
}

function pick(k){if(Q.done)return;if(Q.picked.has(k))Q.picked.delete(k);else Q.picked.add(k);render()}

/* 标记「不认识」：直接判为未掌握，进复习池，需连续答对 HARD_NEED 次 */
function markUnknown(){
  if(!Q||Q.done)return;
  const i=Q.i,s=st(i);
  Q.done=1;Q.unknown=1;Q.pass=0;Q.miss=[];Q.bad=[];
  s.seen++;s.wrong++;s.last=Date.now();
  if(mode==='test')addPool(i,false,HARD_NEED);
  else{const p=S.pool[i];if(p){p.streak=0;p.need=HARD_NEED;save()}else addPool(i,false,HARD_NEED)}
  if(mode==='test'){S.batch.n++}else{rstat.n++}
  save();render()
}
/* 标记「蒙对了」：虽已答对但并未真正掌握，进复习池，需连续答对 HARD_NEED 次 */
function markGuess(){
  if(!Q||!Q.done||!Q.pass||Q.guessed)return;
  const i=Q.i,s=st(i);
  Q.guessed=1;s.guess=(s.guess||0)+1;
  if(mode==='test')addPool(i,false,HARD_NEED);
  else{const p=S.pool[i];if(p){p.streak=0;p.need=HARD_NEED;save()}else addPool(i,false,HARD_NEED)}
  save();render()
}
/* 答错后再升级为「完全不认识」：把移出门槛提到 HARD_NEED */
function markHard(){
  if(!Q||!Q.done||Q.unknown)return;
  const i=Q.i;Q.unknown=1;
  if(mode==='test')addPool(i,false,HARD_NEED);
  else{const p=S.pool[i];if(p){p.streak=0;p.need=HARD_NEED;save()}else addPool(i,false,HARD_NEED)}
  save();render()
}
function quit(){Q=null;render()}

/* ---------- 弹窗 ---------- */
function showModal(h){document.getElementById('modal').innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()">${h}</div>`}
function closeModal(){document.getElementById('modal').innerHTML='';render()}
function alert2(t,m){showModal(`<div class="modal"><b style="font-size:17px">${t}</b><div class="muted small mt12">${m}</div>
  <div class="mt16"><button class="btn" onclick="closeModal()">知道了</button></div></div>`)}
function showBatch(){
  const rate=Math.round(S.batch.ok/S.batch.n*100);
  showModal(`<div class="modal center"><div style="font-size:15px;font-weight:700">本批 ${BATCH} 题完成</div>
   <div class="stat mt16"><div><b>${S.batch.ok}</b><span class="muted small">答对</span></div>
   <div><b>${BATCH-S.batch.ok}</b><span class="muted small">答错</span></div>
   <div><b>${rate}%</b><span class="muted small">正确率</span></div></div>
   <div class="mt16"><button class="btn" onclick="closeModal();go('review')">去复习错词</button></div>
   <div class="mt8"><button class="btn ghost" onclick="cont()">继续测试</button></div></div>`)
}
function cont(){closeModal();adv(S.cur);const i=peek(S.cur);
  if(i<0){Q=null;page='test';render();alert2('本档已测完','可切换频档，或开启「重测全部」再练一轮。');return}Q=makeQ(i);render()}
function showRsum(){
  showModal(`<div class="modal center"><div style="font-size:15px;font-weight:700">本轮复习完成</div>
   <div class="stat mt16"><div><b>${rstat.ok}</b><span class="muted small">答对</span></div>
   <div><b>${rstat.n-rstat.ok}</b><span class="muted small">答错</span></div>
   <div><b>${poolList().length}</b><span class="muted small">池内剩余</span></div></div>
   <div class="mt16"><button class="btn" onclick="closeModal()">完成</button></div></div>`);
  Q=null;render()
}
render();
